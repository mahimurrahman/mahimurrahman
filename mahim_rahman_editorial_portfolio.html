        // Removes solid white background so typography passes cleanly behind Mahim's hair & shoulders
        function processPortraitTransparency(imageUrl, callback) {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
                try {
                    const canvas = document.createElement("canvas");
                    const w = img.naturalWidth || img.width;
                    const h = img.naturalHeight || img.height;
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0);

                    const imgData = ctx.getImageData(0, 0, w, h);
                    const data = imgData.data;

                    // If image already has transparent borders, preserve native asset directly
                    let hasTransparency = false;
                    for (let x = 0; x < w; x += 10) {
                        if (data[x * 4 + 3] === 0) { hasTransparency = true; break; }
                    }
                    if (hasTransparency) {
                        callback(imageUrl);
                        return;
                    }

                    const visited = new Uint8Array(w * h);
                    const queue = [];

                    // Seed background detection from top, left, and right borders
                    for (let x = 0; x < w; x++) {
                        queue.push(x, 0);
                    }
                    for (let y = 0; y < h; y++) {
                        queue.push(0, y);
                        queue.push(w - 1, y);
                    }

                    const isWhiteBg = (idx) => {
                        const r = data[idx];
                        const g = data[idx + 1];
                        const b = data[idx + 2];
                        return r > 230 && g > 230 && b > 230;
                    };

                    let head = 0;
                    while (head < queue.length) {
                        const cx = queue[head++];
                        const cy = queue[head++];
                        const pIdx = cy * w + cx;
                        if (visited[pIdx]) continue;
                        visited[pIdx] = 1;

                        const byteIdx = pIdx * 4;
                        if (isWhiteBg(byteIdx)) {
                            data[byteIdx + 3] = 0; // make transparent

                            if (cx > 0 && !visited[pIdx - 1]) queue.push(cx - 1, cy);
                            if (cx < w - 1 && !visited[pIdx + 1]) queue.push(cx + 1, cy);
                            if (cy > 0 && !visited[pIdx - w]) queue.push(cx, cy - 1);
                            if (cy < h - 1 && !visited[pIdx + w]) queue.push(cx, cy + 1);
                        }
                    }

                    ctx.putImageData(imgData, 0, 0);
                    callback(canvas.toDataURL("image/png"));
                } catch (err) {
                    callback(imageUrl);
                }
            };
            img.onerror = () => callback(imageUrl);
            img.src = imageUrl;

                                    className={`text-xs uppercase tracking-[0.2em] text-cream/50 mb-4 transition-all duration-500 ${mobileMenuOpen
                                            ? "translate-y-0 opacity-100 delay-[500ms]"
                                            : "translate-y-4 opacity-0"
                                        }`}
                                >
                                    Connect
                                </p>
                                <div className="flex flex-wrap gap-x-6 gap-y-2 text-sm">
                                    {socialItems.map((item, i) => (
                                        <a
                                            key={item.label}
                                            href={item.href || "#"}
                                            target={item.external ? "_blank" : undefined}
                                            rel={item.external ? "noopener noreferrer" : undefined}
                                            onClick={item.tab ? (e) => handleNavClick(e, item.tab) : undefined}
                                            className={`text-cream transition-all duration-500 hover:opacity-60 ${mobileMenuOpen
                                                    ? "translate-y-0 opacity-100"
                                                    : "translate-y-4 opacity-0"
                                                }`}
                                            style={{
                                                transitionDelay: mobileMenuOpen
                                                    ? `${550 + i * 60}ms`
                                                    : "0ms",
                                            }}
                                        >
                                            {item.label}
                                        </a>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Slide-over Editorial Portfolio Dossier */}
                    <div
                        className={`fixed inset-0 z-50 transition-opacity duration-500 ${activeDossierTab
                                ? "opacity-100 pointer-events-auto"
                                : "opacity-0 pointer-events-none"
                            }`}
                    >
                        <div
                            className="absolute inset-0 bg-black/60 backdrop-blur-sm"
                            onClick={() => setActiveDossierTab(null)}
                        />

                        <aside
                            className={`editorial-scroll absolute right-0 top-0 h-full w-full max-w-3xl bg-[#141414] text-cream px-6 py-8 sm:px-12 sm:py-12 overflow-y-auto transition-transform duration-[600ms] ease-[cubic-bezier(0.76,0,0.24,1)] ${activeDossierTab ? "translate-x-0" : "translate-x-full"
                                }`}
                        >
                            {/* Dossier Header */}
                            <div className="flex items-start justify-between border-b border-cream/25 pb-6 gap-4">
                                <div className="flex items-center gap-4 sm:gap-6">
                                    <div className="h-16 w-16 sm:h-20 sm:w-20 rounded-full border border-cream/30 overflow-hidden bg-[#171717] flex-shrink-0">
                                        <img
                                            src={portraitSrc}
                                            alt="Mahimur Rahman"
                                            className="h-full w-full object-cover object-top"
                                        />
                                    </div>
                                    <div>
                                        <p className="text-xs uppercase tracking-[0.2em] text-cream/50">
                                            Editorial Portfolio &bull; 2026
                                        </p>
                                        <h2 className="text-3xl sm:text-5xl font-hn tracking-tight mt-1">
                                            {MAHIM_DATA.name}
                                        </h2>
                                        <p className="text-xs sm:text-sm text-cream/70 mt-1">
                                            {MAHIM_DATA.role} &mdash; {MAHIM_DATA.location}
                                        </p>
                                    </div>
                                </div>

                                <button
                                    type="button"
                                    aria-label="Close Dossier"
                                    onClick={() => setActiveDossierTab(null)}
                                    className="p-1 text-cream transition-opacity duration-300 hover:opacity-60"
                                >
                                    <LucideX size={26} strokeWidth={1.5} />
                                </button>
                            </div>

                            {/* Chapter Tab Filters */}
                            <div className="flex flex-wrap items-center gap-x-6 gap-y-2 border-b border-cream/15 py-4 text-xs uppercase tracking-[0.18em]">
                                {[
                                    { id: "all", label: "00 Overview" },
                                    { id: "thoughts", label: "01 Recent Thoughts" },
                                    { id: "interests", label: "02 Areas of Interest" },
                                    { id: "contact", label: "03 Connect" },
                                ].map((tab) => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveDossierTab(tab.id)}
                                        className={`py-1 transition-opacity duration-300 ${activeDossierTab === tab.id
                                                ? "text-cream border-b border-cream"
                                                : "text-cream/45 hover:text-cream"
                                            }`}
                                    >
                                        {tab.label}
                                    </button>
                                ))}
                            </div>

                            {/* Toast Notification */}
                            {copiedToast && (
                                <div className="border-b border-cream bg-cream text-[#141414] px-4 py-2 text-xs uppercase tracking-[0.2em]">
                                    {copiedToast}
                                </div>
                            )}

                            <div className="space-y-12 py-8">
                                {/* Chapter 0: Narrative & Core Philosophy */}
                                {(activeDossierTab === "all") && (
                                    <div>
                                        <div className="flex items-baseline justify-between border-b border-cream pb-2 mb-6">
                                            <span className="text-xs uppercase tracking-[0.2em] text-cream/50">
                                                00 &mdash; Narrative
                                            </span>
                                            <h3 className="text-xl sm:text-2xl font-hn">
                                                Philosophy &amp; Focus
                                            </h3>
                                        </div>
                                        <div className="space-y-5 text-sm sm:text-base leading-relaxed text-cream/90">
                                            {MAHIM_DATA.narrative.map((p, idx) => (
                                                <p key={idx}>{p}</p>
                                            ))}
                                        </div>

                                        {/* Metrics Row */}
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-6 pt-8 mt-6 border-t border-cream/15">
                                            {MAHIM_DATA.stats.map((s) => (
                                                <div key={s.label} className="border-l border-cream/30 pl-4">
                                                    <p className="text-3xl font-hn text-cream">{s.value}</p>
                                                    <p className="text-xs uppercase tracking-[0.16em] text-cream/60 mt-1">{s.label}</p>
                                                    <p className="text-xs text-cream/40 mt-1 leading-normal">{s.desc}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Chapter 1: Recent Thoughts & Essays */}
                                {(activeDossierTab === "all" || activeDossierTab === "thoughts") && (
                                    <div>
                                        <div className="flex items-baseline justify-between border-b border-cream pb-2 mb-6">
                                            <span className="text-xs uppercase tracking-[0.2em] text-cream/50">
                                                01 &mdash; Writing
                                            </span>
                                            <h3 className="text-xl sm:text-2xl font-hn">
                                                Recent Thoughts &amp; Ideas
                                            </h3>
                                        </div>

                                        <p className="text-xs text-cream/60 mb-6 uppercase tracking-[0.15em]">
                                            A collection of reflections on artificial intelligence, technology, and intelligent systems.
                                        </p>

                                        <div className="divide-y divide-cream/15 border-t border-b border-cream/15">
                                            {MAHIM_DATA.thoughts.map((th, idx) => (
                                                <div
                                                    key={idx}
                                                    onClick={() => setSelectedThought(th)}
                                                    className="py-5 group cursor-pointer transition-colors duration-300 hover:bg-cream/5 px-2"
                                                >
                                                    <div className="flex items-center justify-between text-xs text-cream/45 uppercase tracking-[0.14em]">
                                                        <span>{th.date}</span>
                                                        <span>{th.readTime} &rarr;</span>
                                                    </div>
                                                    <h4 className="text-lg sm:text-xl font-hn text-cream mt-1 group-hover:text-cream/80 transition-colors">
                                                        {th.title}
                                                    </h4>
                                                    <p className="text-xs sm:text-sm text-cream/70 mt-2 leading-relaxed">
                                                        {th.excerpt}
                                                    </p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Chapter 2: Areas of Interest */}
                                {(activeDossierTab === "all" || activeDossierTab === "interests") && (
                                    <div>
                                        <div className="flex items-baseline justify-between border-b border-cream pb-2 mb-6">
                                            <span className="text-xs uppercase tracking-[0.2em] text-cream/50">
                                                02 &mdash; Exploration
                                            </span>
                                            <h3 className="text-xl sm:text-2xl font-hn">
                                                Areas of Interest
                                            </h3>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            {MAHIM_DATA.areasOfInterest.map((area) => (
                                                <div
                                                    key={area.id}
                                                    className="border border-cream/15 p-5 bg-[#171717] hover:border-cream/40 transition-colors duration-300"
                                                >
                                                    <div className="flex items-center justify-between text-xs uppercase tracking-[0.16em] text-cream/40 mb-2">
                                                        <span>{area.id}</span>
                                                        <span>System Vector</span>
                                                    </div>
                                                    <h4 className="text-base sm:text-lg font-hn text-cream mb-2">
                                                        {area.title}
                                                    </h4>
                                                    <p className="text-xs sm:text-sm text-cream/70 leading-relaxed">
                                                        {area.summary}
                                                    </p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Chapter 3: Connect & Links */}
                                {(activeDossierTab === "all" || activeDossierTab === "contact") && (
                                    <div>
                                        <div className="flex items-baseline justify-between border-b border-cream pb-2 mb-6">
                                            <span className="text-xs uppercase tracking-[0.2em] text-cream/50">
                                                03 &mdash; Network
                                            </span>
                                            <h3 className="text-xl sm:text-2xl font-hn">
                                                Connect &amp; Collaborate
                                            </h3>
                                        </div>

                                        <p className="text-sm sm:text-base text-cream/80 leading-relaxed mb-6">
                                            Have an idea, project, or collaboration in mind? I'm always open to discussions about mathematics, artificial intelligence, and building meaningful digital systems.
                                        </p>

                                        <div className="divide-y divide-cream/15 border-t border-b border-cream/15 text-sm">
                                            <div className="py-3.5 grid grid-cols-1 sm:grid-cols-3 gap-1">
                                                <span className="text-cream/50 uppercase tracking-[0.12em] text-xs">Linktree</span>
                                                <a href={MAHIM_DATA.linktree} target="_blank" rel="noopener noreferrer" className="sm:col-span-2 text-cream font-mono hover:underline">
                                                    linktr.ee/mahimurrahman &rarr;
                                                </a>
                                            </div>
                                            <div className="py-3.5 grid grid-cols-1 sm:grid-cols-3 gap-1">
                                                <span className="text-cream/50 uppercase tracking-[0.12em] text-xs">Primary Web</span>
                                                <a href={`https://${MAHIM_DATA.domain}`} target="_blank" rel="noopener noreferrer" className="sm:col-span-2 text-cream hover:underline">
                                                    https://{MAHIM_DATA.domain} &rarr;
                                                </a>
                                            </div>
                                            <div className="py-3.5 grid grid-cols-1 sm:grid-cols-3 gap-1">
                                                <span className="text-cream/50 uppercase tracking-[0.12em] text-xs">GitHub</span>
                                                <a href={MAHIM_DATA.github} target="_blank" rel="noopener noreferrer" className="sm:col-span-2 text-cream font-mono hover:underline">
                                                    github.com/mahimurrahman &rarr;
                                                </a>
                                            </div>
                                            <div className="py-3.5 grid grid-cols-1 sm:grid-cols-3 gap-1">
                                                <span className="text-cream/50 uppercase tracking-[0.12em] text-xs">LinkedIn</span>
                                                <a href={MAHIM_DATA.linkedin} target="_blank" rel="noopener noreferrer" className="sm:col-span-2 text-cream hover:underline">
                                                    linkedin.com/in/mahimurrahman-khan &rarr;
                                                </a>
                                            </div>
                                            <div className="py-3.5 grid grid-cols-1 sm:grid-cols-3 gap-1">
                                                <span className="text-cream/50 uppercase tracking-[0.12em] text-xs">Email</span>
                                                <span className="sm:col-span-2 text-cream">{MAHIM_DATA.email}</span>
                                            </div>
                                        </div>

                                        <div className="flex flex-wrap gap-6 pt-6 text-xs uppercase tracking-[0.18em]">
                                            <a
                                                href={MAHIM_DATA.linktree}
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                className="border-b border-cream pb-1 text-cream hover:opacity-60 transition-opacity duration-300"
                                            >
                                                Open Linktree &rarr;
                                            </a>
                                            <button
                                                onClick={() => copyToClipboard(MAHIM_DATA.linktree, "Linktree URL")}
                                                className="border-b border-cream pb-1 text-cream hover:opacity-60 transition-opacity duration-300"
                                            >
                                                Copy Linktree
                                            </button>
                                            <button
                                                onClick={() => copyToClipboard(MAHIM_DATA.email, "Email Address")}
                                                className="border-b border-cream pb-1 text-cream hover:opacity-60 transition-opacity duration-300"
                                            >
                                                Copy Email
                                            </button>
                                            <button
                                                onClick={() => copyToClipboard(MAHIM_DATA.github, "GitHub Profile Link")}
                                                className="border-b border-cream pb-1 text-cream hover:opacity-60 transition-opacity duration-300"
                                            >
                                                Copy GitHub
                                            </button>
                                            <a
                                                href={`mailto:${MAHIM_DATA.email}`}
                                                className="border-b border-cream pb-1 text-cream hover:opacity-60 transition-opacity duration-300"
                                            >
                                                Send Message &rarr;
                                            </a>
                                        </div>
                                    </div>
                                )}

                                {/* Bottom Tag */}
                                <div className="pt-6 border-t border-cream/25 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs text-cream/60">
                                    <p>"{MAHIM_DATA.tagline}"</p>
                                    <p className="uppercase tracking-[0.16em]">
                                        &copy; 2026 {MAHIM_DATA.name}
                                    </p>
                                </div>
                            </div>
                        </aside>
                    </div>

                    {/* Dedicated Reading Modal for Selected Thought */}
                    {selectedThought && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 sm:p-6">
                            <div
                                className="absolute inset-0 bg-black/80 backdrop-blur-md"
                                onClick={() => setSelectedThought(null)}
                            />
                            <div className="relative w-full max-w-2xl bg-[#141414] border border-cream/30 p-6 sm:p-10 text-cream z-10 max-h-[85vh] overflow-y-auto editorial-scroll">
                                <div className="flex items-start justify-between border-b border-cream/20 pb-4">
                                    <div>
                                        <p className="text-xs uppercase tracking-[0.2em] text-cream/50">
                                            {selectedThought.date} &bull; {selectedThought.readTime}
                                        </p>
                                        <h3 className="text-2xl sm:text-3xl font-hn mt-1">
                                            {selectedThought.title}
                                        </h3>
                                    </div>
                                    <button
                                        type="button"
                                        onClick={() => setSelectedThought(null)}
                                        className="text-cream/60 hover:text-cream transition-colors p-1"
                                    >
                                        <LucideX size={24} />
                                    </button>
                                </div>

                                <div className="py-6 space-y-4 text-sm sm:text-base leading-relaxed text-cream/90">
                                    <p className="text-base sm:text-lg italic text-cream border-l-2 border-cream/50 pl-4 py-1">
                                        "{selectedThought.excerpt}"
                                    </p>
                                    <p>{selectedThought.content}</p>
                                </div>

                                <div className="pt-4 border-t border-cream/20 flex justify-between items-center text-xs uppercase tracking-[0.16em] text-cream/50">
                                    <span>Mahimur Rahman Khan &bull; Ideas</span>
                                    <button
                                        onClick={() => setSelectedThought(null)}
                                        className="text-cream hover:underline"
                                    >
                                        Close Reading &rarr;
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </section>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>

</html>
